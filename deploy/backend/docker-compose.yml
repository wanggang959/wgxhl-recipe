services:
  recipe-backend:
    image: eclipse-temurin:17-jre
    container_name: wgxhl-recipe-backend
    restart: unless-stopped
    working_dir: /app
    command: java -Duser.timezone=Asia/Shanghai -jar /app/app.jar
    ports:
      - "127.0.0.1:${APP_PORT:-9001}:9001"
    volumes:
      - ./recipe-backend-1.0.0-SNAPSHOT.jar:/app/app.jar
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      TZ: ${TZ:-Asia/Shanghai}
      APP_PORT: ${APP_PORT:-9001}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      MAIL_FROM: ${MAIL_FROM:-}
      SES_CALLBACK_TOKEN: ${SES_CALLBACK_TOKEN:-}
      SES_SECRET_ID: ${SES_SECRET_ID:-}
      SES_SECRET_KEY: ${SES_SECRET_KEY:-}
      SES_REGION: ${SES_REGION:-ap-guangzhou}
      SES_CODE_TEMPLATE_ID: ${SES_CODE_TEMPLATE_ID:-0}
      SES_RESET_TEMPLATE_ID: ${SES_RESET_TEMPLATE_ID:-0}
      SES_NOTIFICATION_TEMPLATE_ID: ${SES_NOTIFICATION_TEMPLATE_ID:-0}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-168}
      ACCOUNT_SECURITY_PUBLIC_URL: ${ACCOUNT_SECURITY_PUBLIC_URL:-https://recipe.wgxhl.space}
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
      COS_REGION: ${COS_REGION}
      COS_BUCKET: ${COS_BUCKET}
      COS_BASE_URL: ${COS_BASE_URL}
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY}
      PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY}
      PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT:-mailto:admin@wgxhl.space}
      PUSH_TTL_SECONDS: ${PUSH_TTL_SECONDS:-604800}
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
