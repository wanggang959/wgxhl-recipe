spring:
  profiles:
    active: dev
  application:
    name: wgxhl-recipe
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtps
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
        smtps:
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: ${APP_PORT:9001}
  servlet:
    context-path: /recipe

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: input

auth:
  jwt:
    secret: ${JWT_SECRET:}
    expire-hours: ${JWT_EXPIRE_HOURS:168}

account:
  security:
    public-url: ${ACCOUNT_SECURITY_PUBLIC_URL:https://recipe.wgxhl.space}

app:
  platform-admin-user-id: ${PLATFORM_ADMIN_USER_ID:}
  mail:
    provider: ${MAIL_PROVIDER:smtp}
    from: ${MAIL_FROM:}
    callback-token: ${SES_CALLBACK_TOKEN:}
    ses:
      secret-id: ${SES_SECRET_ID:}
      secret-key: ${SES_SECRET_KEY:}
      region: ${SES_REGION:ap-guangzhou}
      code-template-id: ${SES_CODE_TEMPLATE_ID:0}
      reset-template-id: ${SES_RESET_TEMPLATE_ID:0}
      notification-template-id: ${SES_NOTIFICATION_TEMPLATE_ID:0}
      html-templates: ${SES_HTML_TEMPLATES:false}

push:
  vapid:
    public-key: ${PUSH_VAPID_PUBLIC_KEY:}
    private-key: ${PUSH_VAPID_PRIVATE_KEY:}
    subject: ${PUSH_VAPID_SUBJECT:}
  ttl-seconds: ${PUSH_TTL_SECONDS:604800}
