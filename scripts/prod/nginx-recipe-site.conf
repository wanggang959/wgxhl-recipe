# 线上站点配置副本：/opt/1panel/www/conf.d/recipe.wgxhl.space.conf
# 由 1Panel 生成；2026-10-27 手工追加了缓存策略：
#   / 与 /index.html -> no-cache（发布后立即生效）
#   /assets/ -> 一年 immutable（文件名带哈希）
# 在 1Panel 面板修改站点后可能被覆盖，改动前请对照本文件。
server {
    listen 80 ; 
    listen 443 ssl ; 
    server_name recipe.wgxhl.space; 
    index index.php index.html index.htm default.php default.htm default.html; 
    access_log /www/sites/recipe.wgxhl.space/log/access.log main; 
    error_log /www/sites/recipe.wgxhl.space/log/error.log; 
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404; 
    }
    location ^~ /.well-known/acme-challenge {
        allow all; 
        root /usr/share/nginx/html; 
    }
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403; 
    }
    root /www/sites/recipe.wgxhl.space/index; 
    error_page 404 /404.html; 
    http2 on; 
    if ($scheme = http) {
        return 301 https://$host$request_uri; 
    }
    ssl_certificate /www/sites/recipe.wgxhl.space/ssl/fullchain.pem; 
    ssl_certificate_key /www/sites/recipe.wgxhl.space/ssl/privkey.pem; 
    ssl_protocols TLSv1.3 TLSv1.2; 
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED; 
    ssl_prefer_server_ciphers off; 
    ssl_session_cache shared:SSL:10m; 
    ssl_session_timeout 10m; 
    error_page 497 https://$host$request_uri; 
    proxy_set_header X-Forwarded-Proto https; 
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
    add_header Cache-Control "no-cache"; 
    location = / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    include /www/sites/recipe.wgxhl.space/proxy/*.conf; 
}