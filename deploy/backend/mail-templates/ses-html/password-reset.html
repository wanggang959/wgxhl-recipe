<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>重置密码</title>
</head>
<body style="margin:0;padding:0;background:#f6f4f1;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:#352d28;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">请在 30 分钟内设置新密码，链接仅可使用一次。</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f4f1;border-collapse:collapse;">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;border-collapse:collapse;">
        <tr><td style="padding:0 4px 20px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
            <td style="width:38px;vertical-align:middle;"><div style="width:30px;height:30px;line-height:30px;text-align:center;background:#f77720;border-radius:8px;color:#ffffff;font-size:15px;font-weight:700;">家</div></td>
            <td style="vertical-align:middle;font-size:15px;font-weight:700;color:#44352d;">王师傅生活助手</td>
            <td align="right" style="vertical-align:middle;font-size:12px;color:#92847a;">账号安全</td>
          </tr></table>
        </td></tr>
        <tr><td style="background:#ffffff;border:1px solid #ece4dc;border-radius:8px;padding:32px 28px;">
          <div style="font-size:12px;font-weight:700;color:#e96d1e;">安全验证</div>
          <h1 style="margin:10px 0 16px;font-size:24px;line-height:1.4;color:#2e2824;">重置你的登录密码</h1>
          <p style="margin:0;font-size:15px;line-height:1.8;color:#655b54;">我们收到了你的密码重置申请。点击下方按钮，设置新的登录密码。</p>
          <table role="presentation" cellpadding="0" cellspacing="0" style="margin:26px 0 22px;border-collapse:collapse;"><tr><td align="center" style="border-radius:6px;background:#f77720;"><a href="https://recipe.wgxhl.space/#/reset-password?token={{token}}" style="display:inline-block;padding:13px 28px;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;">设置新密码</a></td></tr></table>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;"><tr><td style="background:#f7f8f5;border-left:3px solid #91a88f;padding:13px 15px;font-size:13px;line-height:1.8;color:#61715e;">链接 <strong>30 分钟内有效</strong>，且只能使用一次。密码修改成功后，原有登录将失效。</td></tr></table>
          <p style="margin:24px 0 8px;font-size:12px;line-height:1.7;color:#8e8177;">按钮无法打开？可在浏览器中输入以下地址：</p>
          <p style="margin:0;font-size:12px;line-height:1.7;word-break:break-all;color:#d56b25;">https://recipe.wgxhl.space/#/reset-password?token={{token}}</p>
          <p style="margin:22px 0 0;font-size:13px;line-height:1.8;color:#84766c;">如果不是你本人申请，请忽略此邮件，密码不会自动修改。请勿转发重置链接。</p>
        </td></tr>
        <tr><td style="padding:20px 4px 0;font-size:12px;line-height:1.8;color:#9a8f86;">王师傅生活助手 · 认真照顾每一天<br>这是一封系统邮件，请勿直接回复。</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
